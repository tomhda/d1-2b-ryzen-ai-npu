[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "d1npu2"
version = "0.1.0"
description = "Framework-free d1-2B decisions on the AMD Ryzen AI NPU"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Use the ONNX Runtime supplied by Ryzen AI Software, not the PyPI package.
dependencies = ["numpy", "pillow", "tokenizers"]

[project.optional-dependencies]
download = ["huggingface_hub"]
assemble = ["onnx"]

[project.scripts]
d1npu2 = "d1npu2.cli:entrypoint"

[tool.hatch.build.targets.wheel]
packages = ["d1npu2"]
